-- Relax the setuptools version requirement to match the version available in the
-- FreeBSD ports tree (devel/py-setuptools), avoiding a forced upgrade of the
-- build tool port.

--- pyproject.toml.orig	2026-02-18 10:05:35 UTC
+++ pyproject.toml
@@ -1,6 +1,6 @@
 [build-system]
 requires = [
-    "setuptools >= 80.9.0",
+    "setuptools >= 63.1.0",
     "setuptools_scm >= 9.2.2"
 ]
 build-backend = "setuptools.build_meta"
