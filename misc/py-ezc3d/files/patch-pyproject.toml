-- Simplify the build-system requirements so the port uses the cmake, ninja,
-- swig, and setuptools versions provided by the FreeBSD ports tree instead of
-- the versions declared by upstream.
-- Drop the [project] metadata section to avoid dynamic-version conflicts with
-- the setuptools_scm-less build environment used here.

--- pyproject.toml.orig	2020-02-01 16:00:00 UTC
+++ pyproject.toml
@@ -1,30 +1,11 @@
 [build-system]
 requires = [
-    "setuptools>=61.0",
+    "setuptools",
     "wheel",
     "scikit-build",
-    "cmake",
-    "ninja",
-    "swig",
     "numpy",
 ]
 build-backend = "setuptools.build_meta"

-[project]
-name = "ezc3d"
-dynamic = ["version"]
-dependencies = [
-    "numpy",
-]
-description = "Easy to use C3D reader/writer for C++, Python, and Matlab"
-readme = "README.md"  # This links to your README file
-authors = [
-    {name = "Michaud, Benjamin"},
-    {name = "Begon, Mickaël"}
-]
-license-files = ["LICENSE"]
-urls = { "Homepage" = "https://github.com/pyomeca/ezc3d" }
-requires-python = ">=3.10"
-
 [tool.cibuildwheel]
 build-frontend = "build"
