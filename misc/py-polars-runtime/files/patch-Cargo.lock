-- Update from 1.40.1 to 1.41.2:
--   remove git source for color-backtrace
--   remove git source for object_store (now apache/arrow-rs-object-store)
--   remove tikv-jemallocator dependency (use default allocator)
--
-- The FreeBSD ports cargo infrastructure uses vendored crates,
-- so git sources must be removed. The default allocator is used
-- instead of jemalloc to avoid runtime TLS errors.

--- Cargo.lock.orig	2026-09-08 11:51:29 UTC
+++ Cargo.lock
@@ -1084,7 +1084,6 @@ version = "0.7.4"
 [[package]]
 name = "color-backtrace"
 version = "0.7.4"
-source = "git+https://github.com/orlp/color-backtrace?rev=20f5eea183563bb4cfac9a4d65901d4a1002cde2#20f5eea183563bb4cfac9a4d65901d4a1002cde2"
 dependencies = [
  "btparse",
  "termcolor",
@@ -2883,7 +2882,6 @@ version = "0.14.1"
 [[package]]
 name = "object_store"
 version = "0.14.1"
-source = "git+https://github.com/apache/arrow-rs-object-store?rev=b07471e2bc341278f86e30cf80a850d56cbe2c67#b07471e2bc341278f86e30cf80a850d56cbe2c67"
 dependencies = [
  "async-trait",
  "aws-lc-rs",
@@ -3505,7 +3503,6 @@ dependencies = [
  "rand 0.10.2",
  "rand_distr",
  "thread_local",
- "tikv-jemallocator",
  "tokio",
  "uuid",
 ]
@@ -5309,16 +5306,6 @@ dependencies = [
 dependencies = [
  "cc",
  "libc",
-]
-
-[[package]]
-name = "tikv-jemallocator"
-version = "0.7.0"
-source = "registry+https://github.com/rust-lang/crates.io-index"
-checksum = "249f09e49ab1609436f34c776e84231bead18d6a955f119f939bdc1d847561bd"
-dependencies = [
- "libc",
- "tikv-jemalloc-sys",
 ]
 
 [[package]]
