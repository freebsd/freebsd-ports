--- pyproject.toml.orig	2020-02-02 00:00:00 UTC
+++ pyproject.toml
@@ -39,9 +39,6 @@ pywry = "pywry.cli:main"
 [project.scripts]
 pywry = "pywry.cli:main"
 
-[project.entry-points.pytauri]
-ext_mod = "pywry._vendor.pytauri_wheel.ext_mod"
-
 [project.entry-points."pyinstaller40"]
 hook-dirs = "pywry._pyinstaller_hook:get_hook_dirs"
 
@@ -199,14 +196,6 @@ strict-naming = false
 # Force platform-specific wheel since we bundle native pytauri binaries
 strict-naming = false
 
-# Ship the Claude Code plugin (see repo-root ../claude/plugins/pywry/)
-# inside the wheel at pywry/_claude_plugin/ so `pip install pywry[dev]`
-# leaves the plugin files on disk next to the Python code. The
-# `pywry plugin-path` subcommand prints this location so users can
-# register the plugin locally without a GitHub round-trip.
-[tool.hatch.build.targets.wheel.force-include]
-"../claude/plugins/pywry" = "pywry/_claude_plugin"
-
 [tool.hatch.build.targets.wheel.hooks.custom]
 path = "hatch_build.py"
 
@@ -215,9 +204,6 @@ include = [
     "pywry/**/*",
     "AGENTS.md",
 ]
-
-[tool.hatch.build.targets.sdist.force-include]
-"../claude/plugins/pywry" = "pywry/_claude_plugin"
 
 [tool.hatch.build.targets.sdist.hooks.custom]
 path = "hatch_build.py"
