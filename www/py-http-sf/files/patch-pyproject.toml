-- Old setuptools in the tree rejects the SPDX license string and license-files and cannot satisfy setuptools>=77

--- pyproject.toml.orig	2026-11-12 18:47:33 UTC
+++ pyproject.toml
@@ -7,8 +7,7 @@ requires-python = ">=3.10"
 description = "Parse and serialise HTTP Structured Fields"
 readme = "README.md"
 requires-python = ">=3.10"
-license = "MIT"
-license-files = ["LICENCE.md"]
+license = {text = "MIT"}
 classifiers = [
     "Operating System :: OS Independent",
     "Development Status :: 4 - Beta"
@@ -29,7 +28,7 @@ requires = [
 
 [build-system]
 requires = [
-    "setuptools>=77",
+    "setuptools",
     "wheel"
 ]
 build-backend = "setuptools.build_meta"
