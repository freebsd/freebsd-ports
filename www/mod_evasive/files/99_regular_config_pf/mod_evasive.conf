<IfModule mod_evasive.c>
	DOSEnabled		true
	DOSHashTableSize	3079
	DOSPageCount		2
	DOSSiteCount		50
	DOSPageInterval		1
	DOSSiteInterval		1
	DOSBlockingPeriod	10
	
	# Restrict doas to permit ONLY add address to the table
	# And use cron job to expire table entries
	DOSSystemCommand	"/usr/local/bin/doas /sbin/pfctl -t ddos_list_webserver -T add %"
</IfModule>
