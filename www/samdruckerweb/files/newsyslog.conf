# Rotate the SamDrucker website's nginx logs daily, keeping seven.
#
# The website's sample nginx configuration logs to files named after its
# hostname, for example:
#   /var/log/nginx/samdruckerweb.int.example.org-access.log
#   /var/log/nginx/samdruckerweb.int.example.org-error.log
# The G flag makes the name below a pattern, so this matches any
# hostname starting with samdruckerweb. If yours does not, change it.
# Signal 30 (SIGUSR1) tells nginx to reopen its log files.
#
# logfilename                           [owner:group] mode count size when  flags [/pid_file] [sig_num]
/var/log/nginx/samdruckerweb*.log                     644  7     *    @T00  JG    /var/run/nginx.pid 30
