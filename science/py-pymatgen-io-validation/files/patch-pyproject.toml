-- Fix setuptools/PEP 621 compatibility on FreeBSD by relaxing the build
-- backend requirements and using the table form for project.license. The
-- upstream sdist uses a bare string and a setuptools floor newer than the
-- version available in the ports tree.

--- pyproject.toml.orig
+++ pyproject.toml
@@ -1,6 +1,6 @@
 [build-system]
 build-backend = "setuptools.build_meta"
-requires = ["setuptools >= 65.0.0", "versioningit >= 1,< 4", "wheel"]
+requires = ["setuptools >= 63.1.0", "versioningit >= 1,< 4", "wheel"]
 
 [project]
 authors = [
@@ -32,7 +32,7 @@
 description = "A comprehensive I/O validator for electronic structure calculations"
 dynamic = ["version"]
 keywords = ["io", "validation", "dft", "vasp"]
-license = "BSD-3-Clause-LBNL"
+license = { text = "BSD-3-Clause-LBNL" }
 name = "pymatgen-io-validation"
 readme = "README.md"
 requires-python = '>=3.11'
