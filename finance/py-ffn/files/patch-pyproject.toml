-- Add pytest testpaths so the test runner discovers tests in the tests directory.

--- pyproject.toml.orig	2026-09-14 14:59:07 UTC
+++ pyproject.toml
@@ -70,3 +70,6 @@ Repository = "https://github.com/pmorissette/ffn"

 [tool.ruff.lint.per-file-ignores]
 "__init__.py" = ["F401", "F403"]
+
+[tool.pytest.ini_options]
+testpaths = ["tests"]
