-- Correct ccxt's impossible pycparser pin (3.0 does not exist).
-- pycparser is a transitive dependency of cffi; the latest release is 2.23.
-- Upstream: https://github.com/ccxt/ccxt/issues/29383

--- pyproject.toml.orig	2026-09-14 21:09:39 UTC
+++ pyproject.toml
@@ -1,5 +1,5 @@
 [build-system]
-requires = ["setuptools==83.0.0"]
+requires = ["setuptools>=63.1.0"]
 build-backend = "setuptools.build_meta"
 
 [project]
@@ -7,7 +7,7 @@ readme = "python/README.md"
 version = "4.5.78"
 description = "A cryptocurrency trading API with more than 100 exchanges in JavaScript / TypeScript / Python / C# / PHP / Go"
 readme = "python/README.md"
-license = "MIT"
+license = {text = "MIT"}
 authors = [
     { name = "Igor Kroitor", email = "igor.kroitor@gmail.com" },
 ]
@@ -87,7 +87,7 @@ dependencies = [
     # "pycares==5.0.1",
     # transitive dependencies of cryptography
     "cffi==2.0.0",
-    "pycparser==3.0",
+    "pycparser>=2.23",
     # transitive dependencies of requests
     "charset_normalizer==3.4.7",
     "idna==3.18",
