Relax version requirements of py-setuptools and enable build for older versions
of it.

--- pyproject.toml.orig	2026-10-29 18:41:23 UTC
+++ pyproject.toml
@@ -2,7 +2,7 @@
 # https://www.python.org/dev/peps/pep-0518/
 
 [build-system]
-requires = ["setuptools>=77", "setuptools_scm>=8"]
+requires = ["setuptools", "setuptools_scm>=8"]
 build-backend = "setuptools.build_meta"
 
 [project]
@@ -11,8 +11,7 @@ requires-python = ">=3.12"
 description = "NetBox API client library"
 readme = "README.md"
 requires-python = ">=3.12"
-license = "Apache-2.0"
-license-files = ["LICENSE"]
+license = { text="Apache-2.0" }
 authors = [
     { name = "Zach Moody" },
 ]
