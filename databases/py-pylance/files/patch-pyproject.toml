-- Relax the overly-strict lance-namespace upper bound so the port can be
-- used with the current 0.11.x release in the FreeBSD package collection.

--- pyproject.toml.orig	2026-08-06 02:24:28 UTC
+++ pyproject.toml
@@ -1,7 +1,7 @@
 [project]
 name = "pylance"
 dynamic = ["version"]
-dependencies = ["pyarrow>=14", "numpy>=1.22", "lance-namespace>=0.11.1,<0.12"]
+dependencies = ["pyarrow>=14", "numpy>=1.22", "lance-namespace>=0.11.1"]
 description = "python wrapper for Lance columnar format"
 authors = [{ name = "Lance Devs", email = "dev@lance.org" }]
 license = { file = "LICENSE" }
