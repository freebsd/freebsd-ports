-- Remove build-system dependencies (cmake, cibuildwheel, delocate) that are provided by the ports framework.
--- pyproject.toml.orig	2026-10-29 16:25:49 UTC
+++ pyproject.toml
@@ -2,7 +2,6 @@ description = "Simple package to extract text with coo
 name = "docling-parse"
