 description = "Simple package to extract text with coordinates from programmatic PDFs"
-license = "MIT"
 keywords = ["docling", "pdf", "parser"]
 classifiers = [
     "Operating System :: MacOS :: MacOS X",
@@ -41,27 +40,17 @@ requires = [
 
 [build-system]
 requires = [
-    "setuptools>=77.0.3",
-    "pybind11>=2.13.6",
