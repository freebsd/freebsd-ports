     "wheel>=0.43.0,<1.0.0",
-    "delocate>=0.11.0,<1.0.0",
-    "cmake>=3.27.0,<5.0.0; sys_platform != 'win32'",
-    "cmake>=4.2.0,<5.0.0; sys_platform == 'win32'"
 ]
