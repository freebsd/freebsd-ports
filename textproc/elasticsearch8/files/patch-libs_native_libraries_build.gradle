+def extractLibs = tasks.register('extractLibs', Copy) {
+    into layout.buildDirectory.dir('platform')
+    from configurations.libs
+    // TODO: fix architecture in uploaded libs
+    filesMatching("*-x86-64/*") {
+      it.path = it.path.replace("x86-64", "x64")
+    }
+    filesMatching("win32*/*") {
+      it.path = it.path.replace("win32", "windows")
+    }
+    if (System.getProperty("os.name", "").startsWith("FreeBSD")) {
+      into layout.buildDirectory.dir('platform')
+      if (Boolean.parseBoolean(System.getProperty("freebsd.build.fromPorts", "false"))) {
+        from('%%LOCALBASE%%/lib') {
+          include 'libzstd.so'
+          into 'freebsd-x64'
+        }
+      } else {
+        from('/usr/local/lib') {
+          include 'libzstd.so'
+          into 'freebsd-x64'
+        }
+      }
+      if (Boolean.parseBoolean(System.getProperty("freebsd.build.libvec", "false"))) {
+        from(buildLibVec) {
+          include 'libvec.so'
+          into 'freebsd-x64'
+        }
+      }
+    }
+    includeEmptyDirs = false
+    filePermissions {
+      unix("644")
+    }
+    dirPermissions {
+      unix("755")
+    }
